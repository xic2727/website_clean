<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: Arial, sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .site-rules {
      border: 1px solid #ccc;
      padding: 12px;
      border-radius: 4px;
    }
    .rule-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    input[type="text"] {
      flex: 1;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 6px 12px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
    .delete-btn {
      background: #f44336;
    }
    .delete-btn:hover {
      background: #da190b;
    }
    .action-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .action-buttons button {
      flex: 1;
      background: #2196F3;
    }
    .action-buttons button:hover {
      background: #1976D2;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="action-buttons">
      <button id="export-config">Export</button>
      <button id="import-config">Import</button>
      <input type="file" id="import-input" style="display: none" accept=".json">
    </div>
    <div class="add-site">
      <input type="text" id="site-url" placeholder="Enter website URL">
      <button id="add-site">Add Site</button>
    </div>
    <div id="sites-list"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
